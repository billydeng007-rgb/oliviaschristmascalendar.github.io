<style>

*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:ui-serif,"Songti SC","Noto Serif CJK SC",serif;background-color:#edf4f5;background-image:radial-gradient(ellipse at 12% 16%,#fff 0 2px,transparent 3px),radial-gradient(ellipse at 86% 28%,#fff 0 1.5px,transparent 3px),radial-gradient(ellipse at 74% 82%,#d5e4e8 0 2px,transparent 3px);background-size:170px 150px,220px 190px,250px 210px;min-height:100vh;padding:30px 16px 42px}

.footer{text-align:center;color:#7b8d94;font:11px/1.8 system-ui,sans-serif;padding:0 20px 24px}.footer span{color:#a8874d}.foot-star{color:#92aab2;margin:0 6px}
.veil{position:fixed;inset:0;background:#233b4770;display:grid;place-items:center;padding:18px;z-index:4;opacity:0;visibility:hidden;transition:opacity .2s ease,visibility .2s ease}.veil.show{opacity:1;visibility:visible}.dialog{position:relative;width:min(460px,100%);background:linear-gradient(160deg,#fff,#f6fafb 72%,#edf4f2);border:1px solid #cad9dc;box-shadow:0 22px 70px #20384340;padding:34px 32px 30px;text-align:center;transform:translateY(10px) scale(.985);transition:transform .24s ease}.veil.show .dialog{transform:none}.dialog:before{content:"";position:absolute;inset:8px;border:1px solid #e0e9eb;pointer-events:none}.close{position:absolute;right:17px;top:15px;border:1px solid #d8e3e5;background:#fff;color:#667b83;width:34px;height:34px;font:22px/1 system-ui,sans-serif;cursor:pointer}.close:hover,.close:focus-visible{background:#edf5f6;outline:2px solid #8caab3}.item-icon{font-size:47px;line-height:1.3;margin:6px 0 11px;filter:drop-shadow(0 4px 4px #526d781c)}.stamp{display:inline-block;padding:5px 10px;border:1px solid #bdcfd2;border-radius:2px;color:#617e87;font:11px system-ui,sans-serif;letter-spacing:1px}.dialog h2{font-size:25px;font-weight:500;margin:14px 0 4px}.dialog .date{color:#8a9ba0;font:12px system-ui,sans-serif}.dialog p{font:15px/1.9 system-ui,sans-serif;color:#586d76;margin:17px 0 0}.dialog .blessing{color:#657c74;margin-top:7px}.toast{position:fixed;left:50%;bottom:20px;z-index:5;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#fff;border:1px solid #d2dfe2;padding:12px 17px;box-shadow:0 7px 24px #304c591a;color:#526a73;font:13px/1.55 system-ui,sans-serif;text-align:center;transition:.2s;max-width:calc(100vw - 36px)}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){body{padding:12px 9px 25px}.page:before{inset:6px}.masthead{padding:31px 17px 20px}.decor{top:38px;font-size:21px}.decor.left{left:6%}.decor.right{right:6%}.divider{margin:0 20px}.journey{padding:17px 12px 8px}.calendar{padding:12px 15px 25px;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.number{font-size:18px}.day{gap:5px}.day .mini{font-size:10px}.footer{padding-bottom:20px}}

<style>
.journey{padding-bottom:4px}.route{display:none}.tree-section{text-align:center;padding:4px 20px 15px}.tree-heading{font:500 15px/1.6 system-ui,sans-serif;color:#607981;margin:2px 0 0}.tree-caption{font:11px/1.7 system-ui,sans-serif;color:#8a9a9f;margin:3px 0 0}.tree-stage{position:relative;width:min(100%,340px);height:315px;margin:0 auto}.tree-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.tree-star{position:absolute;left:50%;top:0;transform:translateX(-50%);z-index:2;width:46px;height:46px;border:0;background:transparent;color:#9cabb0;font:36px/1 serif;cursor:not-allowed;text-shadow:0 1px 0 white;transition:color .25s,filter .25s,transform .18s}.tree-star.ready{cursor:pointer;color:#c7b77e}.tree-star.ready:hover,.tree-star.ready:focus-visible{transform:translateX(-50%) scale(1.12);outline:2px solid #bfa85f;outline-offset:2px;border-radius:50%}.tree-star.lit{color:#e1bb54;filter:drop-shadow(0 0 9px #edcf70)}.tree-star .star-glyph{display:block}.tree-star.ready:after{content:"12/24";position:absolute;top:37px;left:50%;transform:translateX(-50%);white-space:nowrap;color:#927b48;font:9px/1.2 system-ui,sans-serif;letter-spacing:0}.tree-svg .candle-flame{fill:#d0dbe0;transition:fill .3s,filter .3s}.tree-svg .candle-body{fill:#e3ebed;stroke:#b8c9ce;stroke-width:1;transition:fill .3s,stroke .3s}.tree-svg .candle.lit .candle-flame{fill:#ffd574;filter:drop-shadow(0 0 4px #ffca59)}.tree-svg .candle.lit .candle-body{fill:#fff0ba;stroke:#ddbd69}

</style>
<style>
.tree-section{padding:10px 20px 22px}.tree-heading{font-size:17px}.tree-caption{font-size:12px}.tree-stage{width:min(100%,460px);height:490px;margin:4px auto 0}.tree-svg{filter:drop-shadow(0 10px 11px #34584716)}.tree-svg .candle-flame{fill:#d7e2dc}.tree-svg .candle-body{fill:#fbfcf8;stroke:#d6dfe0;stroke-width:1.4}.tree-svg .candle.lit .candle-flame{fill:#ffe090;filter:drop-shadow(0 0 6px #ffcf58)}.tree-svg .candle.lit .candle-body{fill:#fff3c8;stroke:#e3c774}.dialog #dialog-copy{white-space:pre-line}

<body>
<main class="page">
  <header class="masthead">

<div class="veil" id="veil" role="presentation">

<script>
// 修改收礼人的名字，以及下面每天的小物件、地点和祝福。
const FRIEND_NAME = "Olivia";
const YEAR = 2026;
// 测试时可在文件地址后加 ?preview=2026-11-25；正式使用时不加参数。
const PREVIEW_PARAM = new URLSearchParams(window.location.search).get("preview");
// 从 11 月 25 日开始，共 30 份日常礼物，加上圣诞特别篇。
const GIFTS = [
  {icon:"",art:"market-light",country:"德国 · 纽伦堡",item:"集市上的小灯",copy:"老城广场的冬日市集点亮了傍晚。小小的灯，也能把回家的路照得温柔。",wish:"愿你的冬天，从一束暖光开始。"},
  {icon:"🍪",country:"德国 · 莱布尼茨",item:"姜饼香气",copy:"姜饼是冬日充饥和暖身的不二之选。愿这份甜香，陪你度过忙碌的一天。",wish:"今天也记得给自己留一口甜。"},
  {icon:"",art:"nutcracker",country:"德国 · 木雕传统",item:"胡桃夹子",copy:"木制胡桃夹子一直是守护永恒的象征。愿它替你看守一点童心和好奇。",wish:"愿你总有让心情变轻的小事。"},
  {icon:"",art:"crepe",country:"法国 · 布列塔尼",item:"热乎乎的可丽饼",copy:"可丽饼是布列塔尼的日常风味之一，街边现做时格外诱人。今天也给自己一点简单的满足吧。",wish:"愿温热的日常，好好接住你。"},
  {icon:"🕯️",country:"法国 · 阿尔萨斯",item:"窗边的烛光",copy:"阿尔萨斯小镇的冬日街景常有精巧的窗饰与灯光。想象一扇亮着灯的窗，等你慢慢走近。",wish:"愿你总能找到安心停靠的地方。"},
  {icon:"🧤",country:"挪威",item:"一副羊毛手套",copy:"北欧寒冷季节里，羊毛手套总是安心的依靠。愿这副想象中的手套，替你护住指尖的温度。",wish:"出门别忘了照顾好自己。"},
  {icon:"🧶",country:"挪威 · 塞特斯达尔",item:"细密的针织花纹",copy:"挪威各地有与众不同的针织图案，正如你值得独一无二的祝福。针脚一圈圈连在一起，像有人在远处惦记你。",wish:"愿你被许多细小的心意围住。"},
  {icon:"🏠",country:"挪威 · 冬日小屋",item:"亮着灯的小木屋",copy:"雪原里漫游，远处的暖光正是此心安处。今晚不必赶路，安心休息就好。",wish:"愿忙碌告一段落，今晚睡个好觉。"},
  {icon:"🎼",country:"奥地利 · 维也纳",item:"咖啡馆里的一段音乐",copy:"街边的咖啡馆飘出贝多芬的旋律，总有一个坐下慢慢享用的理由。愿今天有一段属于你的慢时光。",wish:"不赶时间，也是一种很好的安排。"},
  {icon:"☕",country:"奥地利 · 维也纳",item:"一杯温暖的咖啡",copy:"在维也纳，咖啡馆是坐下来读报、交谈、消磨时光的地方。给自己留个歇脚的空档吧。",wish:"愿你在自己的节奏里，喝口热的。"},
  {icon:"",art:"panettone",country:"意大利 · 米兰",item:"一片潘娜托尼",copy:"这款发酵甜面包源于一次甜蜜的意外，却造就了一项圣诞的传统。分享一片，节日就近了一点。",wish:"愿好味道和好消息，都有人与你分享。"},
  {icon:"🍊",country:"意大利 · 冬日餐桌",item:"一颗冬日柑橘",copy:"冬季柑橘给人们度过寒冬的勇气，让人想起橙花绽放的盛夏。剥开时清新的香气，像给房间打开一扇小窗。",wish:"愿今天也有清爽明亮的瞬间。"},
  {icon:"🏮",country:"印度 · 果阿",item:"门边的纸花与星灯",copy:"在果阿的一些基督教社区，圣诞期间会装饰房屋与教堂。不同家庭有各自的庆祝方式，这盏星灯只代表其中一束节日光亮。",wish:"愿每种不同的喜悦，都被温柔相待。"},
  {icon:"🧣",country:"印度 · 克什米尔",item:"柔软的羊绒披肩",copy:"克什米尔以精细的羊绒与披肩织造闻名。它讲究的纹理与暖意，像一句无需多说的关心。",wish:"愿你在冷风里，也有柔软的依靠。"},
  {icon:"🥐",country:"法国 · 巴黎",item:"清晨的面包香",copy:"冬日早晨的面包店亮起灯，热气从纸袋里轻轻冒出。愿平常的一天，也有值得期待的开场。",wish:"今天从容一点，事情会一件件做好。"},
  {icon:"⭐",country:"德国 · Advent 传统",item:"一颗小小的星星",copy:"降临节日历据传在德国发明，人们会按日开启小惊喜。今天这颗星星，替你点亮属于自己的倒数。",wish:"期待可以很轻，像星光一样就好。"},

const calendar=document.getElementById("calendar"),veil=document.getElementById("veil"),toast=document.getElementById("toast"),treeSvg=document.getElementById("tree-svg"),treeStar=document.getElementById("tree-star");
const START=new Date(YEAR,10,25,0,0,0,0);
const STAR_KEY=`olivia-christmas-star-${YEAR}`;
let lastFocus=null,toastTimer,starLitThisSession=false;
const dateFor=i=>new Date(YEAR,10,25+i,0,0,0,0);
const dateText=d=>`${d.getMonth()+1}月${d.getDate()}日`;
function localToday(){if(PREVIEW_PARAM){const m=PREVIEW_PARAM.match(/^(\d{4})-(\d{2})-(\d{2})$/);if(m){const d=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));if(d.getFullYear()===Number(m[1])&&d.getMonth()===Number(m[2])-1&&d.getDate()===Number(m[3]))return d}}const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate(),0,0,0,0)}
function getUnlocked(){const today=localToday();if(today<START)return -1;return Math.min(GIFTS.length-1,Math.floor((today-START)/86400000))}
function updateCountdown(){const now=localToday(),gap=Math.ceil((START-now)/86400000),box=document.getElementById("countdown"),preview=PREVIEW_PARAM?`测试预览 · 模拟 ${now.getMonth()+1}/${now.getDate()}　|　`:"";if(gap>0){box.innerHTML=`${preview}距离第一份小惊喜还有 <strong>${gap}</strong> 天`}else if(gap===0){box.innerHTML=`${preview}今天开启旅程 <strong>✦</strong>`}else{const n=getUnlocked()+1;box.innerHTML=`${preview}冬日旅程已开启 <strong>${n} / ${GIFTS.length}</strong> 份小惊喜`}}
function renderTree(){const unlocked=getUnlocked(),litCount=Math.max(0,Math.min(30,unlocked+1)),rows=[1,2,3,4,5,5,5,5],positions=[];rows.forEach((count,row)=>{for(let i=0;i<count;i++){const x=count===1?210:210+(i-(count-1)/2)*34;positions.push({x,y:91+row*40})}});treeSvg.querySelectorAll(".candle").forEach(node=>node.remove());positions.forEach((p,i)=>{const candle=document.createElementNS("http://www.w3.org/2000/svg","g");candle.setAttribute("class",`candle${i<litCount?" lit":""}`);candle.setAttribute("transform",`translate(${p.x} ${p.y})`);candle.setAttribute("aria-hidden","true");candle.innerHTML='<path class="candle-flame" d="M0 -9C-6 -2 -4 2 0 2 4 2 6 -2 0 -9Z"/><rect class="candle-body" x="-5" y="2" width="10" height="15" rx="2"/><path d="M-2 6v8" stroke="#fff" stroke-opacity=".65" stroke-width="1"/>';treeSvg.appendChild(candle)});let saved=false;try{saved=localStorage.getItem(STAR_KEY)==="true"}catch{}const isReady=unlocked>=29,wasLit=isReady&&(unlocked>29||saved||starLitThisSession);treeStar.classList.toggle("ready",isReady);treeStar.classList.toggle("lit",wasLit);treeStar.setAttribute("aria-disabled",String(!isReady));treeStar.setAttribute("aria-label",!isReady?"圣诞星星尚未解锁":wasLit?"圣诞星星已点亮，查看祝福":"点亮圣诞树顶的星星");treeStar.querySelector(".star-glyph").textContent=wasLit?"★":"☆";const caption=document.getElementById("tree-caption");if(litCount===0)caption.textContent="11月25日点亮第一支蜡烛";else if(litCount<30)caption.textContent=`已点亮 ${litCount} / 30 支蜡烛 · 每天多一束暖光`;else caption.textContent=wasLit?"30 / 30 支蜡烛与树顶星星都已点亮":"30 / 30 支蜡烛已点亮 · 点击树顶星星收下圣诞祝福"}
function openGift(i,button){const g=GIFTS[i],d=dateFor(i),icon=document.getElementById("dialog-icon");lastFocus=button;if(g.art&&ICON_ART[g.art])icon.innerHTML=ICON_ART[g.art];else icon.textContent=g.icon;document.getElementById("dialog-country").textContent=g.country;document.getElementById("dialog-title").textContent=g.item;document.getElementById("dialog-date").textContent=`${dateText(d)} · 冬日小旅行`;document.getElementById("dialog-copy").textContent=g.copy;document.getElementById("dialog-blessing").textContent=g.wish;veil.classList.add("show");document.body.style.overflow="hidden";document.getElementById("close").focus()}
function openStar(){if(getUnlocked()<29){say("12月24日，圣诞树顶的星星就会为你开启。");return}starLitThisSession=true;try{localStorage.setItem(STAR_KEY,"true")}catch{}renderTree();lastFocus=treeStar;document.getElementById("dialog-icon").textContent="★";document.getElementById("dialog-country").textContent="圣诞树顶 · 特别祝福";document.getElementById("dialog-title").textContent="Merry Christmas";document.getElementById("dialog-date").textContent="12月24日 · 为 Olivia 点亮";document.getElementById("dialog-copy").textContent="Merry Christmas, Olivia\n圣诞快乐，嘉愉，度过一个充满惊喜的2026圣诞";document.getElementById("dialog-blessing").textContent="";veil.classList.add("show");document.body.style.overflow="hidden";document.getElementById("close").focus()}
function closeGift(){veil.classList.remove("show");document.body.style.overflow="";if(lastFocus)lastFocus.focus()}
function say(message){toast.textContent=message;toast.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove("show"),2800)}
function render(){calendar.replaceChildren();const max=getUnlocked();GIFTS.forEach((gift,i)=>{const d=dateFor(i),unlocked=i<=max,b=document.createElement("button");b.type="button";b.className="day"+(unlocked?" opened":" locked")+(i===GIFTS.length-1?" special":"");const label=`${dateText(d)}${i===GIFTS.length-1?"，圣诞特别惊喜":""}${unlocked?"，已开启，可重新查看":"，尚未解锁"}`;b.setAttribute("aria-label",label);b.setAttribute("aria-disabled",String(!unlocked));b.innerHTML=`<span class="number">${d.getMonth()+1}/${String(d.getDate()).padStart(2,"0")}</span><span class="mini" aria-hidden="true">${unlocked?"✧ 已开启":i===GIFTS.length-1?"圣诞惊喜":"❄ 等待中"}</span>`;if(unlocked)b.addEventListener("click",()=>openGift(i,b));else b.addEventListener("click",()=>say(`这份小惊喜会在 ${dateText(d)} 到来时开启，先把期待留给那一天吧。`));calendar.appendChild(b)});renderTree()}
treeStar.addEventListener("click",openStar);
document.getElementById("close").addEventListener("click",closeGift);veil.addEventListener("click",e=>{if(e.target===veil)closeGift()});document.addEventListener("keydown",e=>{if(!veil.classList.contains("show"))return;if(e.key==="Escape")closeGift();if(e.key==="Tab"){e.preventDefault();document.getElementById("close").focus()}});let renderedDate="";function refreshDate(){const d=localToday(),key=`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;if(key!==renderedDate){renderedDate=key;updateCountdown();render()}}document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshDate()});
updateCountdown();render();{const d=localToday();renderedDate=`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`}setInterval(refreshDate,60000);
